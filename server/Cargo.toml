[package]
name = "let-me-play-server"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1.29.0", features = ["v4"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
let-me-play-models = { path = "../models" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
trl = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
dotenv = "0.15.0"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing-subscriber = "0.3.23"
log = "0.4.34"
